<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#191B20"/>
      <stop offset="60%" stop-color="#101114"/>
      <stop offset="100%" stop-color="#0A0B0D"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E0BA"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7828"/>
    </linearGradient>

    <!-- Crisp White-Silver Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDE0E8"/>
    </linearGradient>

    <!-- Card Back Pattern -->
    <pattern id="cardBackPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 16 8 L 8 16 L 0 8 Z" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
      <circle cx="8" cy="8" r="2" fill="#D4AF37" opacity="0.3"/>
    </pattern>

    <!-- Soft Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22C55E" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGlow)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
    <line x1="0" y1="84" x2="1200" y2="84"/>
    <line x1="0" y1="168" x2="1200" y2="168"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="336" x2="1200" y2="336"/>
  </g>

  <!-- Framing Borders with Corner Accents -->
  <rect x="24" y="24" width="1152" height="372" rx="16" fill="none" stroke="#23252C" stroke-width="1.2"/>
  <rect x="32" y="32" width="1136" height="356" rx="12" fill="none" stroke="#1A1C22" stroke-width="1"/>
  
  <!-- Corner Filigree Notches -->
  <path d="M 24 44 L 44 24 M 1176 44 L 1156 24 M 24 376 L 44 396 M 1176 376 L 1156 396" stroke="#D4AF37" stroke-width="1.5" opacity="0.7"/>

  <!-- ==================== LEFT DECORATIVE LUXURY CARDS ==================== -->
  <g transform="translate(190, 210) rotate(-16)" opacity="0.12">
    <rect x="-65" y="-100" width="130" height="200" rx="10" fill="#14161C" stroke="#D4AF37" stroke-width="1.2"/>
    <rect x="-58" y="-93" width="116" height="186" rx="8" fill="url(#cardBackPattern)" stroke="#D4AF37" stroke-width="0.8"/>
  </g>
  <g transform="translate(240, 205) rotate(-5)" opacity="0.18">
    <rect x="-65" y="-100" width="130" height="200" rx="10" fill="#161820" stroke="#D4AF37" stroke-width="1.4"/>
    <rect x="-58" y="-93" width="116" height="186" rx="8" fill="url(#cardBackPattern)" stroke="#D4AF37" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>

  <!-- ==================== RIGHT DECORATIVE LUXURY CARDS ==================== -->
  <g transform="translate(1010, 210) rotate(16)" opacity="0.12">
    <rect x="-65" y="-100" width="130" height="200" rx="10" fill="#14161C" stroke="#D4AF37" stroke-width="1.2"/>
    <rect x="-58" y="-93" width="116" height="186" rx="8" fill="url(#cardBackPattern)" stroke="#D4AF37" stroke-width="0.8"/>
  </g>
  <g transform="translate(960, 205) rotate(5)" opacity="0.18">
    <rect x="-65" y="-100" width="130" height="200" rx="10" fill="#161820" stroke="#D4AF37" stroke-width="1.4"/>
    <rect x="-58" y="-93" width="116" height="186" rx="8" fill="url(#cardBackPattern)" stroke="#D4AF37" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>

  <!-- ==================== CENTERPIECE CONTENT ==================== -->

  <!-- Top Pill Badge (Properly Spaced - No Cutoff) -->
  <g transform="translate(600, 74)">
    <rect x="-170" y="-15" width="340" height="30" rx="15" fill="#15171D" stroke="#2E313A" stroke-width="1"/>
    <!-- Pulsing Green Live Dot -->
    <circle cx="-142" cy="0" r="8" fill="#22C55E" opacity="0.2"/>
    <circle cx="-142" cy="0" r="4.5" fill="#22C55E" filter="url(#glowGreen)"/>
    <!-- Label -->
    <text x="-124" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#A2A7B5" letter-spacing="0.14em">
      REAL-TIME MULTIPLAYER <tspan fill="#D4AF37" font-family="ui-monospace, monospace">// BLUFF</tspan>
    </text>
  </g>

  <!-- Title: CHAL JHOOTHA -->
  <text x="600" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Helvetica Neue', sans-serif" font-size="64" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.03em" filter="url(#softShadow)">
    CHAL JHOOTHA
  </text>

  <!-- Subtitle: Editorial Italic Serif in Warm Gold -->
  <text x="600" y="218" text-anchor="middle" font-family="'Georgia', 'Newsreader', 'Times New Roman', serif" font-style="italic" font-size="20" fill="url(#goldGrad)" letter-spacing="0.03em">
    High-Stakes Deception, Spot the Bluff &amp; Confirm the Win
  </text>

  <!-- Playing Card Suits Row -->
  <g transform="translate(600, 272)">
    <!-- Center Medallion -->
    <circle cx="0" cy="-3" r="22" fill="#16181F" stroke="#2B2E37" stroke-width="1"/>
    <!-- Divider Rays -->
    <line x1="-120" y1="-3" x2="-55" y2="-3" stroke="#262831" stroke-width="1"/>
    <line x1="55" y1="-3" x2="120" y2="-3" stroke="#262831" stroke-width="1"/>
    <!-- Spade -->
    <text x="-80" y="5" text-anchor="middle" font-size="20" fill="#D5D8E2">♠</text>
    <!-- Heart -->
    <text x="-35" y="5" text-anchor="middle" font-size="20" fill="#E54D47">♥</text>
    <!-- Center Joker Star -->
    <text x="0" y="4" text-anchor="middle" font-size="16" fill="#D4AF37">★</text>
    <!-- Diamond -->
    <text x="35" y="5" text-anchor="middle" font-size="20" fill="#E54D47">♦</text>
    <!-- Club -->
    <text x="80" y="5" text-anchor="middle" font-size="20" fill="#D5D8E2">♣</text>
  </g>

  <!-- Tech Spec Bar -->
  <g transform="translate(600, 342)" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Geist Mono', monospace" font-size="11" font-weight="600">
    <text x="0" y="0" fill="#686B76" letter-spacing="0.08em">
      <tspan fill="#A3A7B3">GO ACTOR ENGINE</tspan>
      <tspan fill="#393C45">  ·  </tspan>
      <tspan fill="#A3A7B3">SUB-5MS WEBSOCKETS</tspan>
      <tspan fill="#393C45">  ·  </tspan>
      <tspan fill="#A3A7B3">45S CONTINUOUS CLOCK</tspan>
      <tspan fill="#393C45">  ·  </tspan>
      <tspan fill="#A3A7B3">REACT 19</tspan>
    </text>
  </g>
</svg>
