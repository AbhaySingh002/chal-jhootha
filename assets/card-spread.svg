<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <!-- Paper Warmth and Gradients -->
    <linearGradient id="cardIvory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F3EFE6"/>
    </linearGradient>
    <linearGradient id="cardJoker" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F5EFEB"/>
    </linearGradient>
    
    <!-- Card Drop Shadows -->
    <filter id="cardShadow" x="-15%" y="-10%" width="135%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="heroShadow" x="-20%" y="-15%" width="145%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#C5A059" flood-opacity="0.25"/>
    </filter>

    <!-- Spade Path -->
    <g id="spade">
      <path d="M 0,-18 C -2,-18 -14,-7 -14,3 C -14,9 -8,14 0,14 C 8,14 14,9 14,3 C 14,-7 2,-18 0,-18 Z M -2,11 L -5,20 L 5,20 L 2,11 Z" fill="currentColor"/>
    </g>
    <!-- Heart Path -->
    <g id="heart">
      <path d="M 0,-6 C -2,-12 -8,-16 -13,-16 C -19,-16 -23,-11 -23,-4 C -23,6 -13,14 0,22 C 13,14 23,6 23,-4 C 23,-11 19,-16 13,-16 C 8,-16 2,-12 0,-6 Z" fill="currentColor" transform="scale(0.8)"/>
    </g>
    <!-- Diamond Path -->
    <g id="diamond">
      <path d="M 0,-18 L 13,0 L 0,18 L -13,0 Z" fill="currentColor"/>
    </g>
    <!-- Club Path -->
    <g id="club">
      <circle cx="0" cy="-7" r="8" fill="currentColor"/>
      <circle cx="-8" cy="4" r="8" fill="currentColor"/>
      <circle cx="8" cy="4" r="8" fill="currentColor"/>
      <path d="M -2,7 L -4,18 L 4,18 L 2,7 Z" fill="currentColor"/>
    </g>
  </defs>

  <!-- Surface Base -->
  <rect width="1000" height="340" rx="16" fill="#131417" stroke="#22242A" stroke-width="1.2"/>
  
  <!-- Subtle Table Felt Ring -->
  <ellipse cx="500" cy="270" rx="420" ry="120" fill="#181A20" opacity="0.6"/>

  <!-- ==================== CARD 1: 10 of Clubs (Rotated -14 deg) ==================== -->
  <g transform="translate(230, 185) rotate(-14)" filter="url(#cardShadow)">
    <!-- Body -->
    <rect x="-70" y="-105" width="140" height="210" rx="10" fill="url(#cardIvory)" stroke="#DDD8CD" stroke-width="1"/>
    <rect x="-64" y="-99" width="128" height="198" rx="7" fill="none" stroke="#EAE6DC" stroke-width="0.8"/>
    <!-- Indices -->
    <g fill="#1F2128" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">
      <text x="-56" y="-80" font-size="16" font-weight="800">10</text>
      <use href="#club" x="-50" y="-62" transform="scale(0.55)"/>
      <text x="56" y="86" font-size="16" font-weight="800" transform="rotate(180 50 80)">10</text>
      <use href="#club" x="50" y="62" transform="rotate(180 50 62) scale(0.55)"/>
    </g>
    <!-- Centerpiece -->
    <g fill="#1F2128" transform="translate(0, 0)">
      <use href="#club" transform="scale(1.4)"/>
    </g>
  </g>

  <!-- ==================== CARD 2: Queen of Diamonds (Rotated -7 deg) ==================== -->
  <g transform="translate(360, 175) rotate(-7)" filter="url(#cardShadow)">
    <rect x="-70" y="-105" width="140" height="210" rx="10" fill="url(#cardIvory)" stroke="#DDD8CD" stroke-width="1"/>
    <rect x="-64" y="-99" width="128" height="198" rx="7" fill="none" stroke="#EAE6DC" stroke-width="0.8"/>
    <!-- Indices -->
    <g fill="#D8433E" font-family="'Georgia', serif">
      <text x="-56" y="-80" font-size="18" font-weight="bold">Q</text>
      <use href="#diamond" x="-48" y="-60" transform="scale(0.6)"/>
      <text x="56" y="86" font-size="18" font-weight="bold" transform="rotate(180 50 80)">Q</text>
      <use href="#diamond" x="48" y="60" transform="rotate(180 48 60) scale(0.6)"/>
    </g>
    <!-- Center Pattern -->
    <g fill="#D8433E" transform="translate(0, 0)">
      <use href="#diamond" transform="scale(1.5)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#F0C0BE" stroke-width="1.2" stroke-dasharray="3,3"/>
    </g>
  </g>

  <!-- ==================== CARD 3: King of Hearts (Rotated 0 deg - Elevated) ==================== -->
  <g transform="translate(500, 160)" filter="url(#cardShadow)">
    <rect x="-72" y="-110" width="144" height="220" rx="10" fill="url(#cardIvory)" stroke="#D8D2C5" stroke-width="1"/>
    <rect x="-65" y="-103" width="130" height="206" rx="7" fill="none" stroke="#E5DFD3" stroke-width="0.8"/>
    <!-- Indices -->
    <g fill="#CC332D" font-family="'Georgia', serif">
      <text x="-58" y="-84" font-size="20" font-weight="bold">K</text>
      <use href="#heart" x="-48" y="-62" transform="scale(0.65)"/>
      <text x="58" y="90" font-size="20" font-weight="bold" transform="rotate(180 52 84)">K</text>
      <use href="#heart" x="48" y="62" transform="rotate(180 48 62) scale(0.65)"/>
    </g>
    <!-- Center Piece -->
    <g fill="#CC332D" transform="translate(0, -6)">
      <use href="#heart" transform="scale(1.7)"/>
      <!-- Royal Crown Filigree -->
      <path d="M-18,-24 L-12,-16 L0,-28 L12,-16 L18,-24 L14,-10 L-14,-10 Z" fill="#C5A059" opacity="0.9"/>
    </g>
  </g>

  <!-- ==================== CARD 4: ACE OF SPADES (The Opener - Rotated +7 deg) ==================== -->
  <g transform="translate(640, 175) rotate(7)" filter="url(#heroShadow)">
    <rect x="-72" y="-110" width="144" height="220" rx="10" fill="url(#cardIvory)" stroke="#C8A663" stroke-width="1.5"/>
    <rect x="-65" y="-103" width="130" height="206" rx="7" fill="none" stroke="#E6D7B5" stroke-width="0.8"/>
    <!-- Indices -->
    <g fill="#16181E" font-family="'Georgia', serif">
      <text x="-58" y="-84" font-size="20" font-weight="bold">A</text>
      <use href="#spade" x="-48" y="-62" transform="scale(0.65)"/>
      <text x="58" y="90" font-size="20" font-weight="bold" transform="rotate(180 52 84)">A</text>
      <use href="#spade" x="48" y="62" transform="rotate(180 48 62) scale(0.65)"/>
    </g>
    <!-- Intricate Guilloche Ace Centerpiece -->
    <g fill="#16181E" transform="translate(0, 0)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#C5A059" stroke-width="1" opacity="0.5"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#16181E" stroke-width="0.8" stroke-dasharray="2,2"/>
      <use href="#spade" transform="scale(2)"/>
      <text x="0" y="44" font-family="monospace" font-size="7.5" font-weight="700" fill="#C5A059" text-anchor="middle" letter-spacing="0.2em">
        ROUND OPENER
      </text>
    </g>
  </g>

  <!-- ==================== CARD 5: JHOOTHA JOKER (Rotated +14 deg) ==================== -->
  <g transform="translate(770, 185) rotate(14)" filter="url(#cardShadow)">
    <rect x="-70" y="-105" width="140" height="210" rx="10" fill="url(#cardJoker)" stroke="#DDD8CD" stroke-width="1"/>
    <rect x="-64" y="-99" width="128" height="198" rx="7" fill="none" stroke="#EAE6DC" stroke-width="0.8"/>
    <!-- Indices -->
    <g fill="#E5484D" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      <text x="-58" y="-78" font-size="12" font-weight="900">JOKER</text>
      <text x="-56" y="-60" font-size="14" font-weight="bold">★</text>
      <text x="58" y="84" font-size="12" font-weight="900" transform="rotate(180 48 78)">JOKER</text>
      <text x="56" y="66" font-size="14" font-weight="bold" transform="rotate(180 50 60)">★</text>
    </g>
    <!-- Center Jester Trickster Star -->
    <g fill="#E5484D" transform="translate(0, 0)">
      <polygon points="0,-24 7,-8 24,-8 11,4 16,22 0,11 -16,22 -11,4 -24,-8 -7,-8" fill="#E5484D"/>
      <circle cx="0" cy="0" r="6" fill="#FFFDF9"/>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#181A20" text-anchor="middle" letter-spacing="0.12em">
        CHAL JHOOTHA
      </text>
    </g>
  </g>

  <!-- Bottom Floating Annotation Badge -->
  <g transform="translate(500, 305)" text-anchor="middle">
    <rect x="-170" y="-13" width="340" height="26" rx="13" fill="#191B21" stroke="#2D3039" stroke-width="1"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#9BA1B0" letter-spacing="0.08em">
      1–3 DECKS DEALT EVENLY  ·  EARLIEST <tspan fill="#E2C992">A♠</tspan> OPENS
    </text>
  </g>
</svg>
