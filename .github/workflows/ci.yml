name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Build and Test Go Server
        working-directory: ./chal-jhootha-server
        run: |
          go mod download
          go test -v ./...
          go build -v -o server ./cmd/server

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install and Build Web App
        working-directory: ./chal-jhootha-web
        run: |
          bun install
          bun run build
